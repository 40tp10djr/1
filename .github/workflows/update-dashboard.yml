name: Update PnL Dashboard

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Toss Securities
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_NO: ${{ secrets.TOSS_ACCOUNT_NO }}
        run: python fetch_toss.py || echo "토스 조회 실패 - 로그 확인 필요"

      - name: Fetch KB Securities
        env:
          KB_APP_KEY: ${{ secrets.KB_APP_KEY }}
          KB_APP_SECRET: ${{ secrets.KB_APP_SECRET }}
          KB_ACCOUNT_NO: ${{ secrets.KB_ACCOUNT_NO }}
        run: python fetch_kb.py || echo "KB 조회 실패 - fetch_kb.py를 아직 완성 안 했다면 정상입니다"

      - name: Rebuild dashboard
        run: python update_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "pnl-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "auto: 대시보드 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
